<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your alarms — TriviaAlarm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Mono:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #14231F;
    --surface: #1C332C;
    --surface-raised: #233D34;
    --brass: #C9A227;
    --brass-bright: #E0BC4A;
    --alarm-red: #C1443D;
    --chalk: #EDE6D6;
    --muted: #8FA79C;
    --line: rgba(237, 230, 214, 0.12);
    --font-display: 'Fraunces', serif;
    --font-digit: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-deep);
    color: var(--chalk);
    font-family: var(--font-body);
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--chalk);
    text-decoration: none;
  }
  .logo span { color: var(--brass-bright); }
  #logoutBtn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 56px 24px; }

  #loadingState, #loggedOutState { text-align: center; color: var(--muted); padding: 60px 0; }
  #loggedOutState a { color: var(--brass-bright); }

  #dashboard { display: none; }
  #dashboard.show { display: block; }

  h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.8rem; margin: 0 0 6px; }
  .greeting { color: var(--muted); margin: 0 0 32px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px;
    margin-bottom: 24px;
  }

  /* --- Live clock card --- */
  .live-clock {
    font-family: var(--font-digit);
    font-size: 3rem;
    color: var(--chalk);
    margin: 0 0 4px;
  }
  .live-sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .live-sub strong { color: var(--brass-bright); font-weight: 600; }
  .test-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 100px;
    padding: 8px 16px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .test-btn:hover { border-color: var(--brass); }

  .live-trivia { display: none; margin-top: 22px; border-top: 1px solid var(--line); padding-top: 22px; }
  .live-trivia.open { display: block; }
  .live-trivia-progress {
    font-family: var(--font-digit);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 10px;
  }
  .live-trivia-firing { font-size: 0.85rem; color: var(--muted); margin: 0 0 4px; }
  .live-trivia-q { font-size: 1rem; font-weight: 500; margin: 0 0 14px; }
  .live-trivia-options { display: grid; gap: 8px; }
  .live-trivia-opt {
    text-align: left;
    font-family: var(--font-body);
    font-size: 0.92rem;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface-raised);
    color: var(--chalk);
    cursor: pointer;
  }
  .live-trivia-opt:hover { border-color: var(--brass); }
  .live-trivia-opt.correct { border-color: #6FA97A; background: rgba(111,169,122,0.15); }
  .live-trivia-opt.wrong { border-color: var(--alarm-red); background: rgba(193,68,61,0.15); }
  .live-status { margin-top: 12px; font-family: var(--font-digit); font-size: 0.8rem; color: var(--muted); min-height: 18px; }
  .live-status.silenced { color: #6FA97A; }

  /* --- Alarms list card --- */
  .alarms-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .alarms-head h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.25rem;
    margin: 0;
  }
  #alarmsList { display: grid; gap: 14px; }
  .empty-alarms { color: var(--muted); font-size: 0.92rem; padding: 8px 0; }

  .alarm-row {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .alarm-row-top {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 10px;
    align-items: center;
    margin-bottom: 10px;
  }
  .alarm-row input[type="time"] {
    width: auto;
    min-width: 110px;
  }
  .alarm-row input, .alarm-row select {
    font-family: var(--font-body);
    font-size: 0.92rem;
    color: var(--chalk);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
  }
  .alarm-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .alarm-toggle input { width: auto; padding: 0; }
  .alarm-remove {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .alarm-remove:hover { border-color: var(--alarm-red); color: var(--alarm-red); }
  .alarm-label {
    width: 100%;
  }

  .add-alarm-btn {
    width: 100%;
    background: none;
    border: 1px dashed var(--line);
    color: var(--muted);
    border-radius: 12px;
    padding: 12px 0;
    font-size: 0.92rem;
    cursor: pointer;
    font-family: var(--font-body);
    margin-top: 14px;
  }
  .add-alarm-btn:hover { border-color: var(--brass); color: var(--brass-bright); }

  .save-alarms-btn {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.98rem;
    color: var(--bg-deep);
    background: var(--brass-bright);
    border: none;
    padding: 13px 0;
    border-radius: 100px;
    cursor: pointer;
    margin-top: 18px;
  }
  .save-note { font-size: 0.85rem; color: var(--muted); text-align: center; min-height: 18px; margin-top: 10px; }
  .save-note.ok { color: #6FA97A; }
  .save-note.err { color: var(--alarm-red); }
</style>
</head>
<body>
  <header>
    <a href="/index.html" class="logo">Trivia<span>Alarm</span></a>
    <button id="logoutBtn" type="button">Log out</button>
  </header>

  <div class="wrap">
    <p id="loadingState">Loading your alarms…</p>

    <div id="loggedOutState" style="display:none;">
      <p>You're not signed in.</p>
      <p><a href="/login.html">Log in</a> or <a href="/index.html#signup">create an account</a>.</p>
    </div>

    <div id="dashboard">
      <h1>Your alarms</h1>
      <p class="greeting" id="greeting"></p>

      <div class="card">
        <p class="live-clock" id="liveClock">--:--:--</p>
        <p class="live-sub" id="liveSub">Next alarm: <strong id="nextAlarmLabel">--</strong></p>
        <button class="test-btn" id="testAlarmBtn" type="button">Test alarm now</button>

        <div class="live-trivia" id="liveTrivia">
          <p class="live-trivia-progress" id="liveProgress">Question 1 of 3</p>
          <p class="live-trivia-firing" id="liveFiring"></p>
          <p class="live-trivia-q" id="liveQ"></p>
          <div class="live-trivia-options" id="liveOptions"></div>
          <p class="live-status" id="liveStatus"></p>
        </div>
      </div>

      <div class="card">
        <div class="alarms-head">
          <h2>Manage alarms</h2>
        </div>
        <div id="alarmsList"></div>
        <button type="button" class="add-alarm-btn" id="addAlarmBtn">+ Add another alarm</button>
        <button type="button" class="save-alarms-btn" id="saveAlarmsBtn">Save changes</button>
        <p class="save-note" id="saveNote"></p>
      </div>
    </div>
  </div>

  <script>
    const loadingState = document.getElementById('loadingState');
    const loggedOutState = document.getElementById('loggedOutState');
    const dashboard = document.getElementById('dashboard');
    const greeting = document.getElementById('greeting');
    const alarmsList = document.getElementById('alarmsList');
    const addAlarmBtn = document.getElementById('addAlarmBtn');
    const saveAlarmsBtn = document.getElementById('saveAlarmsBtn');
    const saveNote = document.getElementById('saveNote');
    const logoutBtn = document.getElementById('logoutBtn');

    const CATEGORY_LABELS = {
      general: 'General knowledge',
      geography: 'Geography',
      science: 'Science',
      history: 'History',
      'pop-culture': 'Pop culture',
      surprise: 'Surprise me'
    };
    const CATEGORY_OPTIONS = Object.entries(CATEGORY_LABELS)
      .map(([value, label]) => `<option value="${value}">${label}</option>`)
      .join('');

    function clientId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatTime(t) {
      const [h, m] = t.split(':').map(Number);
      const period = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${h12}:${String(m).padStart(2, '0')} ${period}`;
    }

    let currentAlarms = []; // last-saved alarms — the live clock only fires against this

    function renderAlarms(alarms) {
      if (!alarms.length) {
        alarmsList.innerHTML = '<p class="empty-alarms">No alarms yet. Add one below.</p>';
        return;
      }
      alarmsList.innerHTML = alarms.map((a) => `
        <div class="alarm-row" data-id="${a.id}">
          <div class="alarm-row-top">
            <input type="time" class="alarm-time" value="${a.time}">
            <select class="alarm-category">${CATEGORY_OPTIONS}</select>
            <label class="alarm-toggle"><input type="checkbox" class="alarm-enabled" ${a.enabled ? 'checked' : ''}> On</label>
            <button type="button" class="alarm-remove" title="Remove alarm">✕</button>
          </div>
          <input type="text" class="alarm-label" placeholder="Label (optional, e.g. Weekday)" value="${(a.label || '').replace(/"/g, '&quot;')}">
        </div>
      `).join('');

      alarmsList.querySelectorAll('.alarm-row').forEach((row) => {
        const id = row.dataset.id;
        const match = alarms.find(a => a.id === id);
        if (match) row.querySelector('.alarm-category').value = match.category;
        row.querySelector('.alarm-remove').addEventListener('click', () => {
          const remaining = readAlarmsFromDom().filter(a => a.id !== id);
          renderAlarms(remaining);
        });
      });
    }

    function readAlarmsFromDom() {
      return Array.from(alarmsList.querySelectorAll('.alarm-row')).map(row => ({
        id: row.dataset.id,
        time: row.querySelector('.alarm-time').value,
        category: row.querySelector('.alarm-category').value,
        label: row.querySelector('.alarm-label').value,
        enabled: row.querySelector('.alarm-enabled').checked
      }));
    }

    function render(user) {
      loadingState.style.display = 'none';
      dashboard.classList.add('show');
      greeting.textContent = `Hey ${user.name}, here's what's set for tonight.`;
      currentAlarms = user.alarms || [];
      renderAlarms(currentAlarms);
      updateNextAlarmLabel(new Date());
    }

    fetch('/.netlify/functions/session')
      .then(async (res) => {
        if (!res.ok) throw new Error('not signed in');
        return res.json();
      })
      .then(render)
      .catch(() => {
        loadingState.style.display = 'none';
        loggedOutState.style.display = 'block';
      });

    addAlarmBtn.addEventListener('click', () => {
      const alarms = readAlarmsFromDom();
      alarms.push({ id: clientId(), time: '07:00', category: 'general', label: '', enabled: true });
      renderAlarms(alarms);
    });

    saveAlarmsBtn.addEventListener('click', () => {
      const alarms = readAlarmsFromDom();
      saveNote.textContent = 'Saving…';
      saveNote.className = 'save-note';

      fetch('/.netlify/functions/save-alarms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alarms })
      })
        .then(async (res) => {
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Something went wrong');
          currentAlarms = data.alarms;
          renderAlarms(currentAlarms);
          updateNextAlarmLabel(new Date());
          saveNote.textContent = 'Saved.';
          saveNote.className = 'save-note ok';
        })
        .catch((err) => {
          saveNote.textContent = err.message || 'Something went wrong.';
          saveNote.className = 'save-note err';
        });
    });

    logoutBtn.addEventListener('click', () => {
      fetch('/.netlify/functions/logout', { method: 'POST' }).then(() => {
        window.location.href = '/index.html';
      });
    });

    // --- Live clock + trivia trigger, aware of every enabled alarm ---
    const questions = [
      { q: "What's the largest planet in our solar system?", options: ["Saturn", "Jupiter", "Neptune"], correct: 1 },
      { q: "Which ocean is the largest?", options: ["Atlantic", "Indian", "Pacific"], correct: 2 },
      { q: "In what year did the first iPhone launch?", options: ["2005", "2007", "2009"], correct: 1 },
      { q: "What's the capital of France?", options: ["Lyon", "Marseille", "Paris"], correct: 2 },
      { q: "How many continents are there?", options: ["5", "7", "6"], correct: 1 },
      { q: "What's the fastest land animal?", options: ["Lion", "Cheetah", "Gazelle"], correct: 1 },
      { q: "How many bones does an adult human have?", options: ["186", "206", "226"], correct: 1 },
      { q: "Who wrote \"Romeo and Juliet\"?", options: ["Dickens", "Hemingway", "Shakespeare"], correct: 2 },
      { q: "What currency is used in Japan?", options: ["Won", "Yen", "Yuan"], correct: 1 },
      { q: "What's the smallest prime number?", options: ["1", "2", "3"], correct: 1 },
      { q: "At what temperature does water freeze (Celsius)?", options: ["0°", "10°", "-10°"], correct: 0 },
      { q: "Who was the first person to walk on the moon?", options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong"], correct: 2 },
      { q: "What's the capital of Italy?", options: ["Milan", "Rome", "Venice"], correct: 1 },
      { q: "How many strings does a standard violin have?", options: ["6", "5", "4"], correct: 2 },
      { q: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Mercury"], correct: 1 },
      { q: "What's the capital of Mongolia?", options: ["Ulaanbaatar", "Astana", "Bishkek"], correct: 0 },
      { q: "What's the chemical symbol for tungsten?", options: ["Tu", "W", "Wf"], correct: 1 },
      { q: "Who wrote \"One Hundred Years of Solitude\"?", options: ["Jorge Luis Borges", "Pablo Neruda", "Gabriel García Márquez"], correct: 2 },
      { q: "What's the smallest bone in the human body?", options: ["Malleus", "Incus", "Stapes"], correct: 2 },
      { q: "What year did the Berlin Wall fall?", options: ["1987", "1989", "1991"], correct: 1 },
      { q: "What's the longest river in the world?", options: ["Amazon", "Nile", "Yangtze"], correct: 1 },
      { q: "Which element has the atomic number 79?", options: ["Silver", "Platinum", "Gold"], correct: 2 },
      { q: "How many bones are in the human hand?", options: ["25", "27", "32"], correct: 1 },
      { q: "Which country has the most time zones?", options: ["Russia", "USA", "France"], correct: 2 },
      { q: "What's the deepest oceanic trench?", options: ["Puerto Rico Trench", "Mariana Trench", "Java Trench"], correct: 1 },
      { q: "Which element is first on the periodic table?", options: ["Helium", "Hydrogen", "Lithium"], correct: 1 },
      { q: "Who painted the Mona Lisa?", options: ["Michelangelo", "Raphael", "Leonardo da Vinci"], correct: 2 },
      { q: "Which country gifted the Statue of Liberty to the US?", options: ["United Kingdom", "France", "Spain"], correct: 1 },
      { q: "What's the largest desert in the world by area?", options: ["Sahara", "Gobi", "Antarctica"], correct: 2 },
      { q: "What was Germany's currency before the Euro?", options: ["Franc", "Deutsche Mark", "Lira"], correct: 1 },
      { q: "What year did World War II end?", options: ["1943", "1945", "1947"], correct: 1 },
      { q: "Who is credited with inventing the telephone?", options: ["Thomas Edison", "Nikola Tesla", "Alexander Graham Bell"], correct: 2 },
      { q: "What's the largest mammal on Earth?", options: ["African elephant", "Blue whale", "Giraffe"], correct: 1 },
      { q: "What's the capital of Australia?", options: ["Sydney", "Melbourne", "Canberra"], correct: 2 },
      { q: "Which planet has the most moons?", options: ["Jupiter", "Saturn", "Neptune"], correct: 1 },
      { q: "What's the only mammal capable of true flight?", options: ["Flying squirrel", "Sugar glider", "Bat"], correct: 2 },
      { q: "Half-life is a measurement used to describe what?", options: ["Radioactive decay", "Chemical bonding", "Magnetic fields"], correct: 0 },
      { q: "In which country is the ancient city of Petra located?", options: ["Egypt", "Syria", "Jordan"], correct: 2 },
      { q: "Who wrote \"Crime and Punishment\"?", options: ["Leo Tolstoy", "Anton Chekhov", "Fyodor Dostoevsky"], correct: 2 },
      { q: "What's the hardest naturally occurring substance on Earth?", options: ["Quartz", "Titanium", "Diamond"], correct: 2 },
      { q: "Who is considered the first computer programmer?", options: ["Alan Turing", "Charles Babbage", "Ada Lovelace"], correct: 2 },
      { q: "What's the capital of Kazakhstan?", options: ["Almaty", "Astana", "Bishkek"], correct: 1 },
      { q: "What's the official currency of Brazil?", options: ["Peso", "Real", "Boliviano"], correct: 1 },
      { q: "What's the chemical symbol for antimony?", options: ["An", "Ab", "Sb"], correct: 2 },
      { q: "In what year was the Magna Carta signed?", options: ["1189", "1215", "1315"], correct: 1 },
      { q: "Who composed \"The Four Seasons\"?", options: ["Johann Sebastian Bach", "Antonio Vivaldi", "Wolfgang Amadeus Mozart"], correct: 1 },
      { q: "Which country has the only non-rectangular national flag?", options: ["Bhutan", "Switzerland", "Nepal"], correct: 2 },
      { q: "What's the smallest country in the world by area?", options: ["Monaco", "San Marino", "Vatican City"], correct: 2 },
      { q: "Who was the longest-reigning British monarch before Elizabeth II?", options: ["George III", "Henry VIII", "Queen Victoria"], correct: 2 },
      { q: "How many moons does Mars have?", options: ["1", "2", "4"], correct: 1 }
    ];

    const ROUND_SIZE = 3;
    const NEEDED_CORRECT = 2;
    let roundQuestions = [];
    let roundIndex = 0;
    let roundCorrect = 0;
    let alarmActive = false;
    let ringingAlarm = null;
    const firedMap = {}; // alarmId -> "YYYY-M-D HH:MM" last fired, so it re-fires the next day

    const liveClock = document.getElementById('liveClock');
    const nextAlarmLabel = document.getElementById('nextAlarmLabel');
    const testAlarmBtn = document.getElementById('testAlarmBtn');
    const liveTrivia = document.getElementById('liveTrivia');
    const liveProgress = document.getElementById('liveProgress');
    const liveFiring = document.getElementById('liveFiring');
    const liveQ = document.getElementById('liveQ');
    const liveOptions = document.getElementById('liveOptions');
    const liveStatus = document.getElementById('liveStatus');

    // Synthesized alarm sound (Web Audio API — no audio file needed)
    let audioCtx = null;
    let alarmPlaying = false;
    let alarmTimer = null;

    function ensureAudioCtx() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep(freq, duration, startTime) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.16, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.02);
    }
    function ringPattern() {
      if (!alarmPlaying) return;
      const now = audioCtx.currentTime;
      beep(1046, 0.14, now);
      beep(1046, 0.14, now + 0.2);
      alarmTimer = setTimeout(ringPattern, 850);
    }
    function startAlarmSound() { ensureAudioCtx(); alarmPlaying = true; ringPattern(); }
    function stopAlarmSound() { alarmPlaying = false; if (alarmTimer) clearTimeout(alarmTimer); }

    function pickRoundQuestions() {
      const pool = [...questions];
      const picked = [];
      for (let i = 0; i < ROUND_SIZE && pool.length; i++) {
        const idx = Math.floor(Math.random() * pool.length);
        picked.push(pool.splice(idx, 1)[0]);
      }
      return picked;
    }

    function startRound() {
      roundQuestions = pickRoundQuestions();
      roundIndex = 0;
      roundCorrect = 0;
      loadLiveQuestion();
    }

    function loadLiveQuestion() {
      const set = roundQuestions[roundIndex];
      liveProgress.textContent = `Question ${roundIndex + 1} of ${ROUND_SIZE} · ${roundCorrect} correct so far`;
      liveQ.textContent = set.q;
      liveOptions.innerHTML = '';
      liveStatus.textContent = '';
      liveStatus.classList.remove('silenced');

      set.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'live-trivia-opt';
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          const allOpts = liveOptions.querySelectorAll('.live-trivia-opt');
          allOpts.forEach(b => b.disabled = true);

          const isCorrect = i === set.correct;
          if (isCorrect) {
            btn.classList.add('correct');
            roundCorrect++;
          } else {
            btn.classList.add('wrong');
            const correctBtn = liveOptions.children[set.correct];
            if (correctBtn) correctBtn.classList.add('correct');
          }

          if (roundCorrect >= NEEDED_CORRECT) {
            stopAlarmSound();
            liveStatus.textContent = 'Alarm silenced. Good morning.';
            liveStatus.classList.add('silenced');
            setTimeout(() => {
              liveTrivia.classList.remove('open');
              alarmActive = false;
              ringingAlarm = null;
            }, 1600);
            return;
          }

          roundIndex++;
          if (roundIndex >= ROUND_SIZE) {
            liveStatus.textContent = `Only ${roundCorrect} of ${ROUND_SIZE} right. New round.`;
            setTimeout(() => { startRound(); }, 1100);
          } else {
            liveStatus.textContent = isCorrect ? 'Correct. Next question.' : 'Wrong. The alarm keeps ringing.';
            setTimeout(() => { loadLiveQuestion(); }, 1000);
          }
        });
        liveOptions.appendChild(btn);
      });
    }

    function fireAlarm(alarm) {
      if (alarmActive) return;
      alarmActive = true;
      ringingAlarm = alarm;
      liveFiring.textContent = alarm
        ? `${formatTime(alarm.time)}${alarm.label ? ' · ' + alarm.label : ''} is ringing`
        : 'Test alarm ringing';
      liveTrivia.classList.add('open');
      startAlarmSound();
      startRound();
    }

    function dayKey(d) {
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function computeNextAlarm(now) {
      const enabled = currentAlarms.filter(a => a.enabled);
      if (!enabled.length) return null;
      let best = null;
      enabled.forEach((a) => {
        const [h, m] = a.time.split(':').map(Number);
        const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
        if (target <= now) target.setDate(target.getDate() + 1);
        if (!best || target < best.target) best = { alarm: a, target };
      });
      return best;
    }

    function formatCountdown(ms) {
      const totalMin = Math.max(0, Math.round(ms / 60000));
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h === 0) return `in ${m}m`;
      return `in ${h}h ${m}m`;
    }

    function updateNextAlarmLabel(now) {
      const next = computeNextAlarm(now);
      if (!next) {
        nextAlarmLabel.textContent = 'No alarms enabled';
        return;
      }
      const label = next.alarm.label ? ` · ${next.alarm.label}` : '';
      const cat = CATEGORY_LABELS[next.alarm.category] || 'General knowledge';
      nextAlarmLabel.textContent = `${formatTime(next.alarm.time)}${label} · ${cat} (${formatCountdown(next.target - now)})`;
    }

    function formatClock(d) {
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      const s = String(d.getSeconds()).padStart(2, '0');
      const period = h >= 12 ? 'PM' : 'AM';
      h = h % 12 === 0 ? 12 : h % 12;
      return `${h}:${m}:${s} ${period}`;
    }

    function tickClock() {
      const now = new Date();
      liveClock.textContent = formatClock(now);
      updateNextAlarmLabel(now);

      if (alarmActive) return;

      const hh24 = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const nowMinute = `${hh24}:${mm}`;
      const nowKey = `${dayKey(now)} ${nowMinute}`;

      const due = currentAlarms.find(a => a.enabled && a.time === nowMinute && firedMap[a.id] !== nowKey);
      if (due) {
        firedMap[due.id] = nowKey;
        fireAlarm(due);
      }
    }

    testAlarmBtn.addEventListener('click', () => {
      fireAlarm(null);
    });

    setInterval(tickClock, 1000);
    tickClock();
  </script>
</body>
</html>
